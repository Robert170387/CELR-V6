# Blueprint de Render para CELR v6
# Backend FastAPI (Docker) + Frontend PWA (Static Site) + PostgreSQL en Aiven.
#
# Los valores con `sync: false` se solicitan desde el Dashboard de Render al
# crear el Blueprint (no se versionan secretos aquí).
services:
  # ---------------------------------------------------------------------------
  # Backend: FastAPI + Tesseract, construido desde backend/Dockerfile
  # ---------------------------------------------------------------------------
  - type: web
    name: celr-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      # Cadena de conexión de Aiven. En el dashboard usa el formato:
      #   postgresql://avnadmin:<PASSWORD>@<HOST>:<PORT>/<DB>?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Clave de firma JWT: Render genera un valor aleatorio seguro.
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      # Orígenes permitidos por CORS: dominio del frontend en Render.
      - key: CORS_ORIGINS
        value: https://celr-frontend.onrender.com
      # OCR
      - key: OCR_ENGINE
        value: tesseract
      - key: OCR_LANGS
        value: spa+eng
      - key: OCR_MIN_CONFIDENCE
        value: 40
      - key: OCR_MAX_FILE_MB
        value: 8

  # ---------------------------------------------------------------------------
  # Frontend: React + Vite (PWA) servido como Static Site
  # ---------------------------------------------------------------------------
  - type: web
    name: celr-frontend
    runtime: static
    autoDeployTrigger: commit
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      # URL absoluta del backend. Debe coincidir con el subdominio del servicio
      # celr-backend. Vite la inyecta en build time (tiene prioridad sobre
      # frontend/.env.production).
      - key: VITE_API_URL
        value: https://celr-backend.onrender.com/api/v1
    # SPA: cualquier ruta desconocida se resuelve con index.html (React Router)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
